schema_version: 1
status: draft
machines:
  operation_commit:
    initial: PLANNED
    states:
    - PLANNED
    - SOURCE_VALIDATED
    - SOURCE_STABILITY_BOUND
    - TARGET_PRECONDITION_VALIDATED
    - STAGING_ALLOCATED
    - TRANSFERRED
    - STAGING_DURABLE
    - STAGING_VERIFIED
    - COMMIT_INTENT_RECORDED
    - COMMIT_PRECONDITIONS_REVALIDATED
    - OLD_TARGET_PRESERVED
    - FILESYSTEM_APPLIED
    - FINAL_DURABLE
    - FINAL_VERIFIED
    - CATALOG_RECORDED
    - CLEANED
    - SKIPPED
    - CONFLICT
    - DEFERRED
    - FAILED_RETRYABLE
    - FAILED_BLOCKED
    - CANCELLED
    - ROLLBACK_REQUIRED
    - USER_DECISION_REQUIRED
    terminal:
    - CLEANED
    - SKIPPED
    - CONFLICT
    - DEFERRED
    - FAILED_RETRYABLE
    - FAILED_BLOCKED
    - CANCELLED
    - ROLLBACK_REQUIRED
    - USER_DECISION_REQUIRED
    linear_success_path:
    - PLANNED
    - SOURCE_VALIDATED
    - SOURCE_STABILITY_BOUND
    - TARGET_PRECONDITION_VALIDATED
    - STAGING_ALLOCATED
    - TRANSFERRED
    - STAGING_DURABLE
    - STAGING_VERIFIED
    - COMMIT_INTENT_RECORDED
    - COMMIT_PRECONDITIONS_REVALIDATED
    - FILESYSTEM_APPLIED
    - FINAL_DURABLE
    - FINAL_VERIFIED
    - CATALOG_RECORDED
    - CLEANED
    optional_states:
    - OLD_TARGET_PRESERVED
  cross_store_handoff:
    initial: PREPARED
    states:
    - PREPARED
    - PEER_COMMITTED
    - SOURCE_CONFIRMED
    - COMPLETED
    - ABORTED
    - AMBIGUOUS
    linear_success_path:
    - PREPARED
    - PEER_COMMITTED
    - SOURCE_CONFIRMED
    - COMPLETED
    terminal:
    - COMPLETED
    - ABORTED
    - AMBIGUOUS
  endpoint_ownership:
    states:
    - UNREGISTERED
    - OWNED_BY_THIS_INSTALLATION
    - OWNED_BY_OTHER_INSTALLATION
    - OWNERSHIP_RECOVERY_REQUIRED
    - MARKER_CORRUPT
    takeover_requires:
    - global_mutation_lock
    - no_active_foreign_mutation
    - explicit_user_confirmation
    - ownership_epoch_increment
    - new_endpoint_revision
    - full_reanalysis
  directory_create:
    initial: DIRECTORY_PLANNED
    states:
    - DIRECTORY_PLANNED
    - DIRECTORY_PARENT_VALIDATED
    - DIRECTORY_CREATE_INTENT_RECORDED
    - DIRECTORY_CREATED
    - DIRECTORY_IDENTITY_VERIFIED
    - DIRECTORY_CATALOG_RECORDED
    - DIRECTORY_TYPE_CONFLICT
    linear_success_path:
    - DIRECTORY_PLANNED
    - DIRECTORY_PARENT_VALIDATED
    - DIRECTORY_CREATE_INTENT_RECORDED
    - DIRECTORY_CREATED
    - DIRECTORY_IDENTITY_VERIFIED
    - DIRECTORY_CATALOG_RECORDED
    conflict: DIRECTORY_TYPE_CONFLICT
    terminal:
    - DIRECTORY_CATALOG_RECORDED
    - DIRECTORY_TYPE_CONFLICT
    monotonic: true
  directory_metadata:
    initial: DIRECTORY_METADATA_PLANNED
    states:
    - DIRECTORY_METADATA_PLANNED
    - CHILDREN_TERMINAL
    - METADATA_PRECONDITION_VALIDATED
    - METADATA_INTENT_RECORDED
    - METADATA_APPLIED
    - METADATA_VERIFIED
    - DIRECTORY_CATALOG_RECORDED
    - DIRECTORY_METADATA_CONFLICT
    linear_success_path:
    - DIRECTORY_METADATA_PLANNED
    - CHILDREN_TERMINAL
    - METADATA_PRECONDITION_VALIDATED
    - METADATA_INTENT_RECORDED
    - METADATA_APPLIED
    - METADATA_VERIFIED
    - DIRECTORY_CATALOG_RECORDED
    conflict: DIRECTORY_METADATA_CONFLICT
    terminal:
    - DIRECTORY_CATALOG_RECORDED
    - DIRECTORY_METADATA_CONFLICT
    monotonic: true
  directory_quarantine:
    initial: DIRECTORY_QUARANTINE_PLANNED
    states:
    - DIRECTORY_QUARANTINE_PLANNED
    - DIRECTORY_EMPTY_REVALIDATED
    - QUARANTINE_INTENT_RECORDED
    - DIRECTORY_OBJECT_PRESERVED
    - SOURCE_PATH_REMOVED
    - QUARANTINE_CATALOG_RECORDED
    - DIRECTORY_QUARANTINE_CONFLICT
    linear_success_path:
    - DIRECTORY_QUARANTINE_PLANNED
    - DIRECTORY_EMPTY_REVALIDATED
    - QUARANTINE_INTENT_RECORDED
    - DIRECTORY_OBJECT_PRESERVED
    - SOURCE_PATH_REMOVED
    - QUARANTINE_CATALOG_RECORDED
    conflict: DIRECTORY_QUARANTINE_CONFLICT
    terminal:
    - QUARANTINE_CATALOG_RECORDED
    - DIRECTORY_QUARANTINE_CONFLICT
    monotonic: true
  directory_restore:
    initial: DIRECTORY_RESTORE_PLANNED
    states:
    - DIRECTORY_RESTORE_PLANNED
    - RESTORE_TARGET_ABSENT_REVALIDATED
    - RESTORE_INTENT_RECORDED
    - DIRECTORY_RESTORED
    - DIRECTORY_RESTORE_VERIFIED
    - RESTORE_CATALOG_RECORDED
    - DIRECTORY_RESTORE_CONFLICT
    linear_success_path:
    - DIRECTORY_RESTORE_PLANNED
    - RESTORE_TARGET_ABSENT_REVALIDATED
    - RESTORE_INTENT_RECORDED
    - DIRECTORY_RESTORED
    - DIRECTORY_RESTORE_VERIFIED
    - RESTORE_CATALOG_RECORDED
    conflict: DIRECTORY_RESTORE_CONFLICT
    terminal:
    - RESTORE_CATALOG_RECORDED
    - DIRECTORY_RESTORE_CONFLICT
    monotonic: true
  command_receipt:
    initial: RECEIVED
    states:
    - RECEIVED
    - VALIDATED
    - EFFECT_PREPARED
    - ACCEPTED
    - RUNNING
    - SUCCEEDED
    - REJECTED
    - FAILED
    - CANCELLED
    terminal:
    - SUCCEEDED
    - REJECTED
    - FAILED
    - CANCELLED
    transitions:
      RECEIVED:
      - VALIDATED
      - REJECTED
      VALIDATED:
      - EFFECT_PREPARED
      - REJECTED
      EFFECT_PREPARED:
      - ACCEPTED
      - FAILED
      ACCEPTED:
      - RUNNING
      - SUCCEEDED
      - FAILED
      - CANCELLED
      RUNNING:
      - SUCCEEDED
      - FAILED
      - CANCELLED
    monotonic: true

bundle_version: '2.9.2'
status: draft
owner_acceptance_required: true
authority_note: No contract is authoritative until every governing ADR has owner_decision OWNER_ACCEPTED, the contract is versioned and validated,
  and its status is frozen.
precedence:
- canonical_product_and_safety_requirements
- owner_accepted_adrs
- frozen_machine_readable_contracts
- constraints_and_types_generated_from_frozen_contracts
- executable_conformance_and_safety_tests
- milestone_gates
- explanatory_markdown
allowed_contract_statuses:
- draft
- candidate
- blocked
- frozen

schema_version: 1
status: draft_non_authoritative_0b
authority_note: >
  Draft invariant contract for the catalog/recovery schema. This file is not
  executable DDL and does not replace catalog.sql or recovery.sql. Milestone 1
  must turn the accepted invariants into migrations and negative database tests.
stores:
  catalog:
    selected_by: ADR-003
    writable_owner: engine_host
    sql_contract: catalog.sql
  recovery:
    selected_by: ADR-003
    writable_owner: engine_host
    sql_contract: recovery.sql
invariants:
  - id: DB-001_FILE_ENTRIES_COMPARISON_KEY_IS_NON_UNIQUE
    requirement_id: DB-001
    table: file_entries
    assertion: Case collisions are stored completely; comparison_key is never unique per snapshot.
    must_have_unique_keys:
      - [snapshot_id, relative_path]
      - [snapshot_id, id]
    must_have_non_unique_indexes:
      - [snapshot_id, comparison_key]
    must_not_have_unique_keys:
      - [snapshot_id, comparison_key]
    collision_tables:
      groups: case_collision_groups
      members: case_collision_members
  - id: META-001_WINDOWS_BIRTHTIME
    requirement_id: META-001
    table: file_entries
    column: birthtime_ns
    snapshot_schema_version: 3
    source: WIN32_FILE_CREATION_TIME
    checksum_bound: true
    ctime_fallback_allowed: false
    immutable_after_seal: true
  - id: META-002_NAMED_STREAM_PRESERVATION
    requirement_id: META-002
    active_policy: PRESERVE_WHEN_PORTABLE_BLOCK_IF_UNCONFIRMED
    enumeration_apis: [FindFirstStreamW, FindNextStreamW]
    issue_table: snapshot_issues
    present_issue_code: SNAPSHOT_NAMED_STREAM_PRESENT
    unconfirmed_issue_code: SNAPSHOT_NAMED_STREAM_ENUMERATION_UNCONFIRMED
    findings_checksum_bound: true
    present_findings_block_snapshot_seal: false
    unconfirmed_findings_block_snapshot_seal: true
    directory_stream_findings_block_snapshot_seal: true
    source_and_target_capability_required: true
    target_without_named_stream_support_blocks_plan: true
    stream_hash_algorithm: SHA-256
    stream_fingerprint_fields: [name, byte_count, content_hash]
    exact_verification_stages: [source, staging, final]
    recovery_fingerprint_includes_stream_inventory: true
    retained_versions_restore_and_undo_preserve_streams: true
    primary_stream_only_can_claim_full_object: false
    full_object_assurance_requires_named_stream_verification: true
    named_stream_assurance_level: NAMED_STREAMS_VERIFIED
  - id: FILTER-001_BOUNDED_EVALUATION
    requirement_id: FILTER-001
    assertion: >
      Every source and target snapshot evaluates the same immutable canonical
      filter policy with cheap rules before metadata work and strictly bounded,
      opt-in regular expressions; an evaluation failure leaves coverage
      incomplete and blocks sealing.
    evidence:
      binding_table: job_revision_filter_bindings
      version_table: filter_set_versions
      json_column: rules_json
      hash_column: rules_hash
      hash_algorithm: SHA-256
      canonical_json_required: true
      immutable: true
      supported_schema_versions: [1, 2]
    evaluation:
      default_matcher: GLOB
      ordered_resolution: LAST_MATCH_WINS
      cheap_rules_before_metadata: true
      source_and_target_use_same_policy: true
      max_rules: 128
      max_glob_pattern_length: 512
      supported_rule_kinds:
        - EXTENSION
        - FILE_NAME_GLOB
        - RELATIVE_PATH_GLOB
        - DIRECTORY_GLOB
        - MIN_SIZE_BYTES
        - MAX_SIZE_BYTES
        - MODIFIED_AFTER_NS
        - MODIFIED_BEFORE_NS
        - CREATED_AFTER_NS
        - CREATED_BEFORE_NS
        - HIDDEN_ATTRIBUTE
        - SYSTEM_ATTRIBUTE
        - TEMPORARY_FILE
        - REPARSE_POINT
        - EMPTY_DIRECTORY
        - REGEX
    safe_default_exclusions:
      - $RECYCLE.BIN/**
      - System Volume Information/**
      - Thumbs.db
      - Desktop.ini
      - "*.tmp"
      - "~$*"
    control_area_exclusion_requires_proven_classification: true
    regex:
      engine: regex
      advanced_mode_required: true
      max_rules: 8
      max_pattern_length: 256
      max_input_length: 4096
      per_match_timeout_ms: 5
      total_scan_budget_ms: 2000
      disable_after_timeouts: 2
    failure:
      reason_code: FILTER_REGEX_BUDGET_EXCEEDED
      coverage_state: FILTER_INCOMPLETE
      blocks_snapshot_seal: true
    decision_evidence:
      snapshot_schema_version: 4
      table: snapshot_filter_decisions
      checksum_bound: true
      immutable_after_seal: true
      fields:
        - relative_path
        - object_type
        - decision_state
        - reason_code
        - matched_rule_id
        - evaluation_stage
      max_query_page: 1000
      gui_preview_limit: 5
  - id: END-001_ENDPOINT_CAPABILITY_EVIDENCE
    requirement_id: END-001
    profile_schema_version: 1
    hash_algorithm: SHA-256
    read_observation:
      table: endpoint_classification_observations
      json_column: read_capabilities_json
      hash_column: read_capabilities_hash
      probe_scope: read_only
    writable_observation:
      table: writable_endpoint_capability_observations
      json_column: capabilities_json
      hash_column: capabilities_hash
      probe_scope: controlled_writable
      immutable: true
    writable_registration:
      table: writable_endpoint_registrations
      json_column: write_capabilities_json
      hash_column: write_capabilities_hash
      immutable: true
    plan_requires_exact_hash: true
    missing_or_invalid_evidence_blocks_seal: true
  - id: DUR-001_FINAL_DURABILITY_EVIDENCE
    requirement_id: DUR-001
    receipt_default_state: FINAL_DURABILITY_UNCONFIRMED
    local_file_state: LOCAL_FILE_FLUSH_AND_WRITE_THROUGH_MOVE_CONFIRMED
    local_directory_state: LOCAL_DIRECTORY_MARKER_FLUSH_AND_WRITE_THROUGH_MOVE_CONFIRMED
    local_directory_replay_state: LOCAL_DIRECTORY_MARKER_FLUSH_CONFIRMED_ENTRY_UNCONFIRMED
    write_through_api: MoveFileExW
    write_through_flag: MOVEFILE_WRITE_THROUGH
    endpoint_profile_support_field: supports_write_through_move
    plan_requires_write_through_support: true
    synthetic_adapter_completion_forbidden: true
    recovery_phase: FINAL_DURABLE
    recovery_metadata_column: final_durability_state
    recovery_event_payload_fields:
      - durability_state
      - file_flush_succeeded
      - write_through_move_used
    file_flush_required_for_local_confirmed_state: true
    write_through_claim_requires_actual_use: true
    directory_entry_durability_unconfirmed_without_write_through: true
  - id: VER-001_OPERATION_RESULT_AXES
    requirement_id: VER-001
    outcome_table: operation_outcomes
    attempt_table: operation_attempts
    axis_columns: [transfer_state, assurance_level, durability_level]
    raw_evidence_json_column: verification_json
    transfer_states: [NOT_STARTED, TRANSFERRED, FAILED, CANCELLED]
    assurance_levels:
      - NONE
      - MANIFEST_VERIFIED
      - METADATA_VERIFIED
      - PRIMARY_STREAM_HASH_VERIFIED
      - NAMED_STREAMS_VERIFIED
      - FULL_OBJECT_VERIFIED
    durability_states:
      - NOT_REQUESTED
      - LOCAL_FILE_FLUSH_CONFIRMED
      - WRITE_THROUGH_REQUEST_CONFIRMED
      - REMOTE_ACK_ONLY
      - UNKNOWN
    successful_result_requires:
      transfer_state: TRANSFERRED
      assurance_level_not: NONE
    write_through_claim_scope: request_confirmed
    physical_persistence_claim_forbidden: true
    immutable: true
  - id: DB-006_ENDPOINT_HEADS_ARE_SEPARATE
    requirement_id: DB-006
    stable_table: endpoints
    revision_table: endpoint_revisions
    head_table: endpoint_heads
    head_fk:
      child_columns: [endpoint_id, active_revision_id]
      parent_table: endpoint_revisions
      parent_columns: [endpoint_id, id]
  - id: DB-006_JOB_HEADS_ARE_SEPARATE
    requirement_id: DB-006
    stable_table: jobs
    revision_table: job_revisions
    head_table: job_heads
    head_fk:
      child_columns: [job_id, active_revision_id]
      parent_table: job_revisions
      parent_columns: [job_id, id]
  - id: ARC-005_IMMUTABLE_REVISION_GUARDS
    requirement_id: ARC-005
    assertion: Sealed revision content cannot be updated or deleted in place.
    always_immutable_tables:
      - endpoint_revisions
      - filter_set_versions
      - job_revision_filter_bindings
      - job_revisions
      - standard_backup_job_revision_details
      - writable_endpoint_registrations
      - writable_endpoint_capability_observations
      - controlled_endpoint_takeovers
      - job_lifecycle_events
      - current_read_hash_evidence
      - operation_attempts
      - operation_outcomes
    immutable_after_reference:
      table: filter_sets
      referenced_by_table: job_revisions
      reference_columns: [job_id, filter_set_id]
      identity_columns: [job_id, id]
    identity_guard:
      table: standard_backup_job_endpoint_bindings
      immutable_columns:
        - job_id
        - job_revision_id
        - role
        - ordinal
        - endpoint_id
        - endpoint_revision_id
        - created_utc
      mutable_columns:
        - registration_state
        - registration_reason_code
    mutable_head_tables:
      - endpoint_heads
      - job_heads
    endpoint_generation:
      revision_table: endpoint_revisions
      generation_column: generation
      positive: true
      monotonic_insert: true
      exact_bindings:
        - table: snapshots
          columns: [endpoint_id, endpoint_revision_id, endpoint_generation]
        - table: plan_endpoints
          columns: [endpoint_id, endpoint_revision_id, endpoint_generation]
      runtime_capability: MutationPermit
  - id: CTRL-001_WRITABLE_ENDPOINT_REGISTRATION
    requirement_id: CTRL-001
    assertion: >
      Writable target registration is restartable, binds one verified control
      marker and write probe to an exact new endpoint generation, and advances
      the active job through a new immutable revision.
    intent_table: writable_endpoint_registration_intents
    evidence_table: writable_endpoint_registrations
    intent_identity_immutable: true
    terminal_states: [COMMITTED, BLOCKED]
    evidence_immutable: true
    endpoint_revision_binding:
      columns: [endpoint_id, endpoint_revision_id, endpoint_generation]
    active_heads_advanced:
      - endpoint_heads
      - job_heads
  - id: OWN-001_CONTROLLED_ENDPOINT_TAKEOVER
    requirement_id: OWN-001
    assertion: >
      A controlled takeover is restartable, binds the exact foreign owner and
      epoch to an immutable next-epoch marker and write probe, advances endpoint
      and job heads through new revisions, and queues a full analysis that may
      not start a run automatically.
    intent_table: controlled_endpoint_takeover_intents
    evidence_table: controlled_endpoint_takeovers
    intent_identity_immutable: true
    terminal_states: [COMMITTED, BLOCKED]
    evidence_immutable: true
    epoch_rule: ownership_epoch = previous_ownership_epoch + 1
    endpoint_revision_binding:
      columns: [endpoint_id, endpoint_revision_id, endpoint_generation]
    full_analysis_required: true
    start_when_safe: false
    active_heads_advanced:
      - endpoint_heads
      - job_heads
  - id: SYNC-002_INITIAL_BACKUP_PLAN_MATERIALIZATION
    requirement_id: SYNC-002
    assertion: >
      The first backup plan is derived from exact sealed snapshots, saved with
      its active job revision as one catalog transaction, and never starts a
      run without a separate explicit command.
    materialization_table: initial_backup_plan_materializations
    terminal_states: [SEALED, NO_CHANGES]
    terminal_immutable: true
    exact_bindings:
      active_revision_columns: [job_id, job_revision_id]
      analysis_column: analysis_id
      plan_column: plan_id
    execution_requires_explicit_start: true
  - id: SYNC-002_PLAN_OPERATION_TARGET_BINDING
    requirement_id: SYNC-002
    table: plan_operation_seal_details
    assertion: >
      Every operation-schema-v2 mutating plan operation in a plan with writable
      endpoints is bound to one exact writable plan endpoint, and each run
      target may materialize only the operations carrying its endpoint id.
    target_column: target_endpoint_id
    valid_target_table: plan_endpoints
    valid_target_role: TARGET_WRITABLE
    checksum_bound_from_operation_schema_version: 2
    legacy_single_target_backfill: true
    immutable_after_seal: true
  - id: HASH-001_CURRENT_READ_HASH_EVIDENCE
    requirement_id: HASH-001
    table: current_read_hash_evidence
    assertion: >
      Identical-file skipping is driven only by immutable full BLAKE3 reads
      bound to exact snapshot entries with equal before/after fingerprints.
    evidence_kind: CURRENT_READ_HASH
    algorithm: BLAKE3-256
    hash_schema_version: 1
    fingerprint_must_be_stable: true
    immutable: true
  - id: SRC-001_SOURCE_FILE_PRECONDITION
    requirement_id: SRC-001
    assertion: >
      Every operation-schema-v3 copy binds the source path, file type, byte
      count and stable scanner identity into the sealed plan and recovery
      journal; transfer validates that identity before and after reading.
    snapshot_table: file_entries
    snapshot_identity_column: identity_fingerprint_hash
    snapshot_schema_version: 2
    plan_table: plan_operation_seal_details
    plan_source_path_column: source_relative_path
    plan_precondition_column: source_precondition_json
    operation_schema_version: 3
    recovery_table: recovery_operations
    recovery_precondition_column: source_precondition_json
    precondition_schema_version: 1
    checksum_bound: true
    before_and_after_transfer_validation: true
  - id: DB-004_RETAINED_VERSION_EXPIRY
    requirement_id: DB-004
    assertion: >
      A preserved old target file or displaced empty directory is cataloged
      only with a canonical self-hashed manifest, and time-based expiry uses an
      immutable plan plus append-only events before deleting the exact
      payload/manifest pair under a fresh endpoint mutation permit.
    root_table: retained_version_objects
    supported_object_roles:
      - OLD_TARGET_VERSION
      - EMPTY_DIRECTORY_QUARANTINE
    plan_table: version_retention_plans
    item_table: version_retention_items
    hold_table: version_retention_holds
    event_table: version_retention_events
    immutable_root_bindings: true
    immutable_plan_manifest: true
    immutable_plan_items: true
    append_only_events: true
    delete_root_rows: false
    requires_active_job: true
    excludes_active_holds: true
    requires_exact_cleaned_recovery_reference: true
    rechecks_before_delete_intent: true
    filesystem_delete_requires_fresh_mutation_permit: true
    manifest_and_payload_verified_before_delete: true
    crash_resume_states:
      - DELETE_INTENT_RECORDED
      - FILESYSTEM_DELETED
    restore_operation_table: retained_version_restore_operations
    restore_event_table: retained_version_restore_events
    restore_rollback_lifecycle_table: retained_version_restore_rollbacks
    restore_rollback_event_table: retained_version_restore_rollback_events
    restore_requires_active_hold: true
    restore_immutable_binding: true
    restore_append_only_events: true
    restore_requires_fresh_mutation_permit: true
    restore_preserves_current_before_replace: true
    restore_verifies_source_rollback_and_final: true
    restore_releases_hold_only_after_final_verification: true
    restore_rollback_immutable_binding: true
    restore_rollback_append_only_events: true
    restore_undo_requires_completed_restore: true
    restore_undo_requires_explicit_confirmation: true
    restore_undo_requires_fresh_mutation_permit: true
    restore_undo_requires_unchanged_restored_final: true
    restore_undo_full_hash_verifies_final: true
    restore_rollback_kept_after_undo_until_expiry: true
    restore_rollback_expiry_verifies_pair_before_intent: true
    restore_rollback_expiry_records_intent_before_delete: true
    restore_rollback_expiry_is_crash_resumable: true
    restore_crash_resume_states:
      - INTENT_RECORDED
      - CURRENT_FINAL_PRESERVED
      - HISTORICAL_APPLIED
      - FINAL_VERIFIED
    restore_undo_crash_resume_states:
      - UNDO_INTENT_RECORDED
      - UNDO_APPLIED
      - UNDO_VERIFIED
    restore_rollback_expiry_crash_resume_states:
      - EXPIRY_INTENT_RECORDED
  - id: TIME-001_ENDPOINT_RETRY_TIMING
    requirement_id: TIME-001
    table: run_target_endpoint_wait_events
    assertion: >
      Each endpoint wait records a bounded actual backoff and display-only UTC
      retry time; a live Engine Host derives retry eligibility from a monotonic
      deadline so wall-clock changes cannot accelerate an active wait.
    immutable: true
    backoff_column: backoff_ms
    retry_audit_column: retry_not_before_utc
    minimum_backoff_ms: 1
    maximum_backoff_ms: 300000
    live_deadline_clock: monotonic
    restart_reconciliation_clock: utc_once_then_monotonic
  - id: DB-007_PARENT_SCOPE_COMPOSITE_KEYS
    requirement_id: DB-007
    assertion: Security-relevant child rows are bound to their parent scope with composite keys.
    required_composite_foreign_keys:
      - child_table: endpoint_heads
        child_columns: [endpoint_id, active_revision_id]
        parent_table: endpoint_revisions
        parent_columns: [endpoint_id, id]
      - child_table: job_heads
        child_columns: [job_id, active_revision_id]
        parent_table: job_revisions
        parent_columns: [job_id, id]
      - child_table: job_revisions
        child_columns: [job_id, filter_set_id]
        parent_table: filter_sets
        parent_columns: [job_id, id]
      - child_table: filter_set_versions
        child_columns: [job_id, filter_set_id]
        parent_table: filter_sets
        parent_columns: [job_id, id]
      - child_table: job_revision_filter_bindings
        child_columns: [job_id, job_revision_id]
        parent_table: job_revisions
        parent_columns: [job_id, id]
      - child_table: job_revision_filter_bindings
        child_columns: [job_id, filter_set_id, filter_set_version]
        parent_table: filter_set_versions
        parent_columns: [job_id, filter_set_id, version]
      - child_table: writable_endpoint_registration_intents
        child_columns: [job_id, source_job_revision_id]
        parent_table: job_revisions
        parent_columns: [job_id, id]
      - child_table: writable_endpoint_registrations
        child_columns: [endpoint_id, endpoint_revision_id]
        parent_table: endpoint_revisions
        parent_columns: [endpoint_id, id]
      - child_table: controlled_endpoint_takeover_intents
        child_columns: [job_id, source_job_revision_id]
        parent_table: job_revisions
        parent_columns: [job_id, id]
      - child_table: controlled_endpoint_takeover_intents
        child_columns: [endpoint_id, source_endpoint_revision_id]
        parent_table: endpoint_revisions
        parent_columns: [endpoint_id, id]
      - child_table: controlled_endpoint_takeovers
        child_columns: [endpoint_id, endpoint_revision_id]
        parent_table: endpoint_revisions
        parent_columns: [endpoint_id, id]
      - child_table: analyses
        child_columns: [job_id, job_revision_id]
        parent_table: job_revisions
        parent_columns: [job_id, id]
      - child_table: standard_backup_job_snapshot_materializations
        child_columns: [job_id, job_revision_id]
        parent_table: job_revisions
        parent_columns: [job_id, id]
      - child_table: initial_backup_plan_materializations
        child_columns: [job_id, job_revision_id]
        parent_table: job_revisions
        parent_columns: [job_id, id]
      - child_table: analysis_targets
        child_columns: [endpoint_id, endpoint_revision_id]
        parent_table: endpoint_revisions
        parent_columns: [endpoint_id, id]
      - child_table: snapshots
        child_columns: [analysis_id, endpoint_id]
        parent_table: analysis_targets
        parent_columns: [analysis_id, endpoint_id]
      - child_table: snapshots
        child_columns: [endpoint_id, endpoint_revision_id]
        parent_table: endpoint_revisions
        parent_columns: [endpoint_id, id]
      - child_table: file_entries
        child_columns: [snapshot_id, endpoint_id]
        parent_table: snapshots
        parent_columns: [id, endpoint_id]
      - child_table: current_read_hash_evidence
        child_columns: [snapshot_id, entry_id]
        parent_table: file_entries
        parent_columns: [snapshot_id, id]
      - child_table: current_read_hash_evidence
        child_columns: [snapshot_id, endpoint_id]
        parent_table: snapshots
        parent_columns: [id, endpoint_id]
      - child_table: case_collision_members
        child_columns: [snapshot_id, file_entry_id]
        parent_table: file_entries
        parent_columns: [snapshot_id, id]
      - child_table: case_collision_members
        child_columns: [snapshot_id, group_id]
        parent_table: case_collision_groups
        parent_columns: [snapshot_id, id]
      - child_table: operation_dependencies
        child_columns: [plan_id, before_operation_id]
        parent_table: planned_operations
        parent_columns: [plan_id, id]
      - child_table: operation_dependencies
        child_columns: [plan_id, after_operation_id]
        parent_table: planned_operations
        parent_columns: [plan_id, id]
      - child_table: operation_outcomes
        child_columns: [run_id, plan_id]
        parent_table: runs
        parent_columns: [id, plan_id]
      - child_table: operation_outcomes
        child_columns: [run_id, run_target_id]
        parent_table: run_targets
        parent_columns: [run_id, id]
      - child_table: operation_outcomes
        child_columns: [plan_id, operation_id]
        parent_table: planned_operations
        parent_columns: [plan_id, id]
      - child_table: operation_attempts
        child_columns: [run_attempt_id, run_id]
        parent_table: run_attempts
        parent_columns: [id, run_id]
      - child_table: operation_attempts
        child_columns: [run_id, plan_id]
        parent_table: runs
        parent_columns: [id, plan_id]
      - child_table: operation_attempts
        child_columns: [run_id, run_target_id]
        parent_table: run_targets
        parent_columns: [run_id, id]
      - child_table: operation_attempts
        child_columns: [plan_id, operation_id]
        parent_table: planned_operations
        parent_columns: [plan_id, id]
